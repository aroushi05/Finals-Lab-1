<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Info Card Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Generate Your Info Card</h1>
        <p>Fill in your details, then click "Show My Info" to see your card!</p>
      </header>

      <main class="layout">
        <!-- ================= FORM ================= -->
        <section class="card form-card">
          <h2>Your Information</h2>
          <form id="infoForm">
            <div class="field">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="Juan Dela Cruz" required />
            </div>

            <div class="field">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="juan@example.com" required />
            </div>

            <div class="field">
              <label for="age">Age</label>
              <input type="number" id="age" min="1" max="120" placeholder="19" required />
            </div>

            <div class="field">
              <label for="birthdate">Birthdate</label>
              <input type="date" id="birthdate" required />
            </div>

            <div class="field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="09XX XXX XXXX" required />
            </div>

            <div class="field">
              <label for="favColor">Favorite Color</label>
              <input type="text" id="favColor" placeholder="e.g., teal or #008080" required />
            </div>

            <div class="field">
              <label for="country">Country</label>
              <select id="country" required>
                <option value="" selected disabled>Select a country</option>
                <option value="Philippines">Philippines</option>
                <option value="United States">United States</option>
                <option value="Japan">Japan</option>
                <option value="Canada">Canada</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field" id="countryOtherField" hidden>
              <label for="countryOther">Enter your country</label>
              <input type="text" id="countryOther" placeholder="Type your country" disabled />
            </div>

            <fieldset class="field">
              <legend>Gender</legend>
              <label class="inline">
                <input type="radio" name="gender" value="Male" required /> Male
              </label>
              <label class="inline">
                <input type="radio" name="gender" value="Female" /> Female
              </label>
              <label class="inline">
                <input type="radio" name="gender" value="Prefer not to say" /> Prefer not to say
              </label>
            </fieldset>

            <fieldset class="field">
              <legend>Hobbies</legend>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Reading" /> Reading
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Gaming" /> Gaming
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Coding" /> Coding
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Sports" /> Sports
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Music" /> Music
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Music" /> Art
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Music" /> Traveling
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Music" /> Cooking
              </label>
              <label class="inline">
                <input type="checkbox" class="hobby" value="Music" /> Photography
              </label>
            </fieldset>

            <div class="field">
              <label for="bio">About Me</label>
              <textarea id="bio" rows="4" placeholder="Tell us a bit about yourself..."></textarea>
            </div>

            <div class="actions">
              <button type="button" id="showInfoBtn" class="btn primary">Show My Info</button>
              <button type="reset" id="clearBtn" class="btn secondary">Clear Form</button>
            </div>
          </form>
        </section>

        <!-- ================= OUTPUT ================= -->
        <section class="card output-card">
          <h2>Your Info Card</h2>
          <div id="outputDisplay" class="output-display">
            <p class="placeholder">Your details will appear here after you click "Show My Info".</p>
          </div>
        </section>
      </main>

      <footer class="page-footer">
        <p>Copyright &copy; 2026 Jaybee Oriola. All rights reserved.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
